name: bench

# Runs the tests and the benchmark on x86-64 and on 64-bit ARM runners.
# Trigger manually from the Actions tab, or on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -short ./internal/...
      - run: go run ./cmd/bench -tag ${{ matrix.runner }} -out results-ci
      - run: go run ./cmd/queuesim -mode measured -results results-ci -tag ${{ matrix.runner }} -out results-ci/queuesim_${{ matrix.runner }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}
          path: results-ci
